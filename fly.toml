# fly.toml app configuration file generated for hostel-api on 2026-10-28T11:24:25+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hostel-api'
primary_region = 'fra'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_SECURE_COOKIE = 'true'

  APP_DEBUG = "false"
  APP_URL = "https://hostel-api.fly.dev"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"
  DB_CONNECTION = "mysql"
  DB_HOST = "mysql-3305dda0-hostel-ballot.j.aivencloud.com"
  DB_PORT = "21307"
  DB_DATABASE = "defaultdb"
  DB_USERNAME = "avnadmin"
  MYSQL_ATTR_SSL_CA = "/var/www/html/certs/ca.pem"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
